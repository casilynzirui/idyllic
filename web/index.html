<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Idyllic (Web Demo)</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      html, body {
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      
      #root {
        height: 100vh;
        width: 100vw;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f5f5f5;
      }
      
      /* Mobile app container */
      #root > div {
        width: 100%;
        max-width: 414px; /* iPhone Pro Max width */
        height: 100vh;
        max-height: 896px; /* iPhone Pro Max height */
        background-color: white;
        border-radius: 0;
        box-shadow: 0 0 20px rgba(0,0,0,0.1);
        overflow: hidden;
        position: relative;
      }
      
      /* For larger screens, make it look like a phone */
      @media (min-width: 768px) {
        #root {
          padding: 20px;
        }
        
        #root > div {
          border-radius: 20px;
          height: calc(100vh - 40px);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
